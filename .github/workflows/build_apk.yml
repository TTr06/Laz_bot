name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: android_app
        run: |
          gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release_apk
          cp android_app/app/build/outputs/apk/debug/app-debug.apk release_apk/LazBot_v1.0.apk

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LazBot-Android-APK
          path: release_apk/LazBot_v1.0.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0-${{ github.run_number }}"
          name: "LazBot Android APK v1.0 (Build #${{ github.run_number }})"
          body: |
            ### 📱 LazBot - Trình theo dõi giỏ hàng Lazada & Cửa sổ nổi
            - **Cửa sổ nổi (Floating Bubble):** Hiển thị giá trực tiếp trên màn hình, hỗ trợ kéo thả và đa nhiệm mượt mà.
            - **Chuẩn xác 100%:** Tự động click "Chọn tất cả" và đọc giá cuối cùng sau khi áp dụng voucher tích lũy / giảm giá.
            - **Chạy nền 24/7:** Chạy qua Foreground Service, không lo hệ điều hành tắt ngầm.
            - **Thông báo Telegram:** Báo động ngay khi phát hiện giảm giá.
          files: release_apk/LazBot_v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
